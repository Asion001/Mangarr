version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # openapi-typescript still needs TypeScript 5 as a peer, so a
      # TypeScript major breaks npm ci. Lift this once it supports the new one.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # The web stage tracks the Node LTS line that CI uses (setup-node and
      # the Makefile's NODE_IMAGE); move all three together by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
